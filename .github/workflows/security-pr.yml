name: Security PR Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --no-banner --redact --exit-code 1

  trivy:
    name: Trivy FS + Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository for vulnerabilities and misconfigurations
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            aquasec/trivy:latest \
            fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            /repo

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc
          elif [ -f requirements-dev.txt ]; then
            pip-audit -r requirements-dev.txt --desc
          elif [ -f pyproject.toml ]; then
            pip-audit
          else
            echo "No Python dependency manifest found."
          fi

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            echo "No Node lockfile found."
          fi

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Scan Python code
        run: |
          if find . -path './.git' -prune -o -name '*.py' -print -quit | grep -q .; then
            bandit -r . -lll -iii -x tests
          else
            echo "No Python files found for Bandit."
          fi
